<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Форум гаджетов</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<script>
async function createTopic() {
    const titleInput = document.getElementById("title");
    const title = titleInput.value.trim();

    if (!title) {
        alert("Введите название темы");
        return;
    }

    const response = await fetch("/create-topic", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title })
    });

    const data = await response.json();
    if (data.id !== undefined) {
        window.location.href = `/topic/${data.id}`;
    } else {
        alert("Ошибка при создании темы");
    }
}
</script>

<body>
<div class="container">
  <div class="header">
    <h1>🔧 GadgetTech Forum</h1>
    <p>Обсуждение гаджетов, техники и технологий</p>
  </div>
  <input id="title" placeholder="Название новой темы">
  <button type="button" onclick="createTopic()">Создать тему</button>
  <div class="topic-list">
    {% for t in topics %}
      <div class="topic">
        <a href="/topic/{{t.id}}">{{t.title}}</a>
      </div>
    {% endfor %}
  </div>
  <div class="footer">
    © GadgetTech Forum • AI Assistant
  </div>
</div>
<script src="/static/forum.js"></script>
<button onclick="location.href='http://127.0.0.1:5500'"> Назад на сайт магазина</button>
</body>
</html>
